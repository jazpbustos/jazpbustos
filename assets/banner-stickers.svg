<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Hola, soy Jazmín Bustos</title>
<desc id="desc">Desarrollo de software e Informática. Collage de stickers con una ventana de código, flores, estrellas y un cursor sobre papel crema.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9cfc8" stroke-width=".7" opacity=".5"/></pattern>
  <clipPath id="frame"><rect width="960" height="340" rx="22"/></clipPath>
<style>
@keyframes floatCode {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes codePulse {0%,100%{opacity:1}50%{opacity:.55}}
@keyframes flowerSway {0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes cursorMove {0%,100%{transform:translate(0,0)}35%,55%{transform:translate(-18px,-13px)}65%{transform:translate(-18px,-13px) scale(.94)}75%{transform:translate(-18px,-13px)}}
@keyframes sparkle {0%,100%{opacity:.45}50%{opacity:1}}
.code-float {animation:floatCode 5s ease-in-out infinite}
.code-symbol {animation:codePulse 3s ease-in-out infinite}
.flower {transform-box:fill-box;transform-origin:center;animation:flowerSway 6s ease-in-out infinite}
.pointer {transform-box:fill-box;transform-origin:center;animation:cursorMove 6s ease-in-out infinite}
.sparkles {animation:sparkle 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g clip-path="url(#frame)">
<rect width="960" height="340" fill="#faf5ec"/><rect width="960" height="340" fill="url(#grid)"/>
<ellipse cx="482" cy="175" rx="262" ry="136" fill="#faf5ec"/>
<g class="code-float"><g transform="translate(33 67) rotate(-9 86 67)">
  <rect x="3" y="6" width="165" height="131" rx="15" fill="#ded2dd"/>
  <rect width="165" height="131" rx="13" fill="#d9c8f0" stroke="white" stroke-width="7"/>
  <path d="M2 30H163" stroke="#614065" stroke-width="1.5"/>
  <g fill="#765779"><circle cx="17" cy="15" r="3"/><circle cx="28" cy="15" r="3"/><circle cx="39" cy="15" r="3"/></g>
  <text class="code-symbol" x="82" y="86" text-anchor="middle" font-family="Consolas,monospace" font-size="43" font-weight="bold" fill="#53365b">&lt;/&gt;</text>
  <text x="82" y="113" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#614065">IDEAS EN CÓDIGO</text>
</g>
</g><g class="flower"><g transform="translate(782 50) rotate(12 56 55)">
  <g fill="#edb2c6" stroke="white" stroke-width="5">
    <ellipse cx="57" cy="29" rx="17" ry="28"/><ellipse cx="57" cy="81" rx="17" ry="28"/>
    <ellipse cx="32" cy="43" rx="17" ry="28" transform="rotate(-60 32 43)"/><ellipse cx="82" cy="68" rx="17" ry="28" transform="rotate(-60 82 68)"/>
    <ellipse cx="32" cy="68" rx="17" ry="28" transform="rotate(60 32 68)"/><ellipse cx="82" cy="43" rx="17" ry="28" transform="rotate(60 82 43)"/>
  </g>
  <circle cx="57" cy="55" r="20" fill="#f6d58c"/>
  <g fill="#68475f"><circle cx="50" cy="53" r="2"/><circle cx="64" cy="53" r="2"/></g><path d="M51 61Q57 67 63 61" fill="none" stroke="#68475f" stroke-width="2" stroke-linecap="round"/>
</g>
</g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="480" y="87" font-size="12" font-weight="600" letter-spacing="4" fill="#93778e">UN POQUITO DE MI MUNDO</text>
  <text x="480" y="127" font-size="20" fill="#89677e">Hola, soy</text>
  <path d="M256 190Q480 177 705 191L700 211Q480 200 259 214Z" fill="#eed9eb"/>
  <text x="480" y="193" font-size="59" font-weight="750" letter-spacing="-2.5" fill="#59364f">Jazmín Bustos</text>
  <text x="480" y="235" font-size="19" fill="#72566e">Desarrollo de software · Informática</text>
  <rect x="365" y="266" width="230" height="30" rx="15" fill="#e9e0f0"/>
  <text x="480" y="286" font-size="12" letter-spacing="1.2" fill="#715275">curiosidad + creatividad + código</text>
</g>
